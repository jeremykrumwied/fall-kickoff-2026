<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9th Annual Fall Kickoff - Interactive Site Map</title>
    <style>
        :root {
            --terracotta: #a35d47;
            --cream: #f7f7f3;
            --dark: #121212;
            --gold: #c9933b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--dark);
            color: #ffffff;
            line-height: 1.4;
            padding-bottom: 40px;
        }

        header {
            background-color: #1e1e1e;
            padding: 12px 20px;
            border-bottom: 2px solid var(--gold);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-titles h1 {
            color: var(--gold);
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header-titles p {
            color: #aaa;
            font-size: 0.85rem;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-header {
            background-color: var(--terracotta);
            color: #fff;
            padding: 8px 14px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-header:hover {
            background-color: #8c4c37;
        }

        .btn-secondary {
            background-color: #333;
            border: 1px solid #555;
        }

        .btn-secondary:hover {
            background-color: #444;
        }

        .instruction-banner {
            text-align: center;
            background-color: #222;
            color: var(--gold);
            padding: 8px;
            font-size: 0.85rem;
            border-bottom: 1px solid #333;
        }

        /* MAP CONTAINER */
        .map-container {
            position: relative;
            max-width: 1200px;
            margin: 20px auto;
            border: 2px solid var(--gold);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            background-color: #1a1a1a;
        }

        .map-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* PIN OVERLAYS */
        .pin {
            position: absolute;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.82);
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
            border: 1px solid var(--gold);
            box-shadow: 0 2px 8px rgba(0,0,0,0.6);
            white-space: nowrap;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.15s ease, background-color 0.15s ease;
            user-select: none;
        }

        .pin:hover {
            transform: translate(-50%, -50%) scale(1.1);
            background-color: var(--terracotta);
            border-color: #ffffff;
            z-index: 20;
        }

        /* VERTICAL ORIENTATION SUPPORT */
        .pin.vertical {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            padding: 8px 4px;
        }

        /* MODAL POPUP */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active { display: flex; }

        .modal-card {
            background-color: var(--cream);
            color: #222;
            max-width: 420px;
            width: 100%;
            border-radius: 8px;
            padding: 24px;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid var(--terracotta);
            animation: popIn 0.2s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .close-btn {
            position: absolute;
            top: 10px; right: 14px;
            font-size: 1.6rem;
            background: none;
            border: none;
            cursor: pointer;
            color: #777;
        }

        .close-btn:hover { color: #000; }

        .modal-title {
            color: var(--terracotta);
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .modal-body {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #333;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-titles">
            <h1>9TH ANNUAL FALL KICKOFF SITE MAP</h1>
            <p>6825 Sweetgrass Lane • Interactive Location Layout</p>
        </div>
        <div class="header-actions">
            <a href="./index.html" class="btn-header btn-secondary">📜 Back to Invitation</a>
            <button class="btn-header" onclick="window.print()">🖨️ Print / Save PDF</button>
        </div>
    </header>

    <div class="instruction-banner">
        💡 Tap or click any pin on the map to see details and schedules!
    </div>

    <div class="map-container" id="mapContainer">
        <!-- BACKGROUND MAP IMAGE -->
        <img src="./yard-map.jpg" alt="Fall Kickoff Site Map" class="map-img">

        <!-- PINS GENERATED FROM BUILDER JSON -->
    </div>

    <!-- MODAL POPUP -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeInfo(event)">
        <div class="modal-card">
            <button class="close-btn" onclick="forceCloseInfo()">&times;</button>
            <div class="modal-title" id="modalTitle">Pin Info</div>
            <div class="modal-body" id="modalBody">Details...</div>
        </div>
    </div>

    <script>
        // Exact pin positions from your builder JSON
        const pinData = [
            { "label": "🎆 Fireworks Launch Zone", "x": "82.2%", "y": "32.6%", "orientation": "horizontal", "desc": "Grand Finale fireworks show begins at dusk (~8:15 PM)! Please maintain a safe distance during launching." },
            { "label": "🚒 Touch-a-Truck", "x": "82.5%", "y": "41%", "orientation": "horizontal", "desc": "Jackson Township Fire Truck on site! Kids can explore the fire engine from 4:30 PM – 7:00 PM." },
            { "label": "📍 Check-In Tent", "x": "76.8%", "y": "47.5%", "orientation": "horizontal", "desc": "Sponsored by Maid Right! Check in here upon arrival to collect your meal tickets ($5 adult / free kids) and snow cone coins." },
            { "label": "🎸 Band Stage (Deck)", "x": "65.4%", "y": "56.8%", "orientation": "horizontal", "desc": "Live musical performance on the main deck by Dream Slice from 5:30 PM to 9:00 PM!" },
            { "label": "Patio Lounge", "x": "63.7%", "y": "61.8%", "orientation": "horizontal", "desc": "Relaxing outdoor seating area to enjoy food, drinks, and live music." },
            { "label": "🔥 Fire", "x": "75.5%", "y": "66.7%", "orientation": "horizontal", "desc": "Main campfire setup for cozy evening seating and warming up." },
            { "label": "🎯 Lawn Games", "x": "83%", "y": "66.3%", "orientation": "vertical", "desc": "Cornhole, giant Jenga, ladder toss, and other lawn games available all evening!" },
            { "label": "⛺ Dining Tent", "x": "76.8%", "y": "77.1%", "orientation": "horizontal", "desc": "Covered seating area to enjoy Porkopolis BBQ, chili, and food." },
            { "label": "🎨 Kids Coloring", "x": "90%", "y": "62.1%", "orientation": "vertical", "desc": "Craft and coloring table set up for kids of all ages!" },
            { "label": "🏰 Bounce House Alley", "x": "72.9%", "y": "87.4%", "orientation": "horizontal", "desc": "Bounce houses open for kids from 4:00 PM until dusk!" },
            { "label": "🚚 Vendor Row", "x": "90%", "y": "72.2%", "orientation": "vertical", "desc": "Food truck lineup including Porkopolis BBQ, chili station, and drinks on tap!" },
            { "label": "🎃 Pumpkin Patch", "x": "71.4%", "y": "95%", "orientation": "horizontal", "desc": "Pick a pumpkin to decorate or take home!" },
            { "label": "🔥 Trail Fire Pit/Smores", "x": "53.6%", "y": "70.5%", "orientation": "vertical", "desc": "Trail fire pit stocked with marshmallows, graham crackers, and chocolate for S'mores!" },
            { "label": "🚜 Hayride Route", "x": "54.3%", "y": "94%", "orientation": "horizontal", "desc": "Scenic hayride route running continuously from 4:30 PM until dusk." },
            { "label": "Bathrooms", "x": "85.7%", "y": "55.4%", "orientation": "vertical", "desc": "Restroom facilities located here." },
            { "label": "🚗 One Row Parking Please", "x": "19.2%", "y": "32.2%", "orientation": "horizontal", "desc": "Please park in a single row along this stretch of Sweetgrass Lane." },
            { "label": "🚗 One Row Parking Please", "x": "4.9%", "y": "37.8%", "orientation": "horizontal", "desc": "Please park in a single row along this stretch of Sweetgrass Lane." },
            { "label": "🚗 4 Row Parking", "x": "54.3%", "y": "41.5%", "orientation": "horizontal", "desc": "Main designated parking zone. Please park close together in 4 compact rows." },
            { "label": "🚜 Hayride Pickup", "x": "90%", "y": "81.6%", "orientation": "vertical", "desc": "Board the tractor-drawn hayride here!" },
            { "label": "After Party", "x": "71.6%", "y": "91.2%", "orientation": "horizontal", "desc": "Post-fireworks gathering around the deck fire pits!" },
            { "label": "🏰 Toddler Bounce House", "x": "66.5%", "y": "66.3%", "orientation": "vertical", "desc": "Dedicated safe bounce area for toddlers and younger children." },
            { "label": "Soccer/Football", "x": "69.9%", "y": "43.8%", "orientation": "horizontal", "desc": "Open grass field for football, soccer, and open play." }
        ];

        const container = document.getElementById('mapContainer');

        // Render pins onto the map
        pinData.forEach(item => {
            const pin = document.createElement('div');
            pin.className = `pin ${item.orientation === 'vertical' ? 'vertical' : ''}`;
            pin.style.left = item.x;
            pin.style.top = item.y;
            pin.innerText = item.label;
            
            pin.onclick = () => openInfo(item.label, item.desc);
            container.appendChild(pin);
        });

        function openInfo(title, desc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerText = desc;
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeInfo(e) {
            if (e.target.id === 'modalOverlay') {
                document.getElementById('modalOverlay').classList.remove('active');
            }
        }

        function forceCloseInfo() {
            document.getElementById('modalOverlay').classList.remove('active');
        }
    </script>
</body>
</html>

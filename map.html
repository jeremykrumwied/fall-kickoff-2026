<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Map</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    /* Responsive Map Container */
    .map-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .map-image {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Marker Base Styles */
    .map-marker {
      position: absolute;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      z-index: 10;
    }

    .marker-badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #007bff;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
      flex-shrink: 0;
    }

    /* Full Tag Style */
    .marker-full {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #ddd;
      border-radius: 24px;
      padding: 3px 10px 3px 3px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
      gap: 6px;
    }
    .marker-content { display: flex; flex-direction: column; line-height: 1.2; }
    .marker-title { font-weight: bold; font-size: 11px; color: #222; white-space: nowrap; }
    .marker-desc { font-size: 9px; color: #666; white-space: nowrap; }

    /* Icon Only Style */
    .marker-icon-only .marker-badge {
      background-color: #343a40;
      border: 2px solid #fff;
    }
    .marker-tooltip {
      display: none;
      position: absolute;
      bottom: 120%;
      left: 50%;
      transform: translateX(-50%);
      background: #222;
      color: #fff;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 10px;
      white-space: nowrap;
      z-index: 20;
    }
    .marker-icon-only:hover .marker-tooltip,
    .marker-icon-only.active .marker-tooltip { display: block; }

    /* Mobile Scaling Adaptations */
    @media (max-width: 600px) {
      .marker-title { font-size: 9px; }
      .marker-desc { font-size: 8px; }
      .marker-badge { width: 26px; height: 26px; font-size: 11px; }
      .marker-full { padding: 2px 6px 2px 2px; gap: 4px; }
    }
  </style>
</head>
<body>

  <div class="map-container">
    <img src="yard-map.jpg" alt="Event Map" class="map-image">

    <!-- Your Exact Markers with Pumpkins Icon Upgraded -->
    <div class="map-marker marker-full" style="top: 40.7%; left: 57.36%;">
      <div class="marker-badge"><i class="fas fa-parking"></i></div>
      <div class="marker-content">
        <span class="marker-title">Parking</span>
        <span class="marker-desc">4 Row</span>
      </div>
    </div>

    <div class="map-marker marker-full" style="top: 49.34%; left: 84.5%;">
      <div class="marker-badge"><i class="fas fa-clipboard-check"></i></div>
      <div class="marker-content">
        <span class="marker-title">Check-In</span>
        <span class="marker-desc"></span>
      </div>
    </div>

    <div class="map-marker marker-full" style="top: 93.17%; left: 92.93%;">
      <div class="marker-badge"><i class="fas fa-glass-cheers"></i></div>
      <div class="marker-content">
        <span class="marker-title">After Party</span>
        <span class="marker-desc"></span>
      </div>
    </div>

    <div class="map-marker marker-full" style="top: 33%; left: 16.36%;">
      <div class="marker-badge"><i class="fas fa-parking"></i></div>
      <div class="marker-content">
        <span class="marker-title">Parking</span>
        <span class="marker-desc">One Row only</span>
      </div>
    </div>

    <div class="map-marker marker-full" style="top: 39.56%; left: 11.5%;">
      <div class="marker-badge"><i class="fas fa-parking"></i></div>
      <div class="marker-content">
        <span class="marker-title">Parking</span>
        <span class="marker-desc">One Row Only</span>
      </div>
    </div>

    <div class="map-marker marker-full" style="top: 79.53%; left: 66.21%;">
      <div class="marker-badge"><i class="fas fa-fire"></i></div>
      <div class="marker-content">
        <span class="marker-title">Fire / S'mores</span>
        <span class="marker-desc">Bonfire Area</span>
      </div>
    </div>

    <div class="map-marker marker-full" style="top: 35.81%; left: 91.79%;">
      <div class="marker-badge"><i class="fas fa-bolt"></i></div>
      <div class="marker-content">
        <span class="marker-title">Fireworks Launch</span>
        <span class="marker-desc"></span>
      </div>
    </div>

    <div class="map-marker marker-icon-only" style="top: 87.44%; left: 96.21%;">
      <div class="marker-badge"><i class="fas fa-tractor"></i></div>
      <span class="marker-tooltip">Hayride Pickup</span>
    </div>

    <div class="map-marker marker-icon-only" style="top: 85.15%; left: 85.07%;">
      <div class="marker-badge"><i class="fas fa-chess-rook"></i></div>
      <span class="marker-tooltip">Bounce Houses</span>
    </div>

    <div class="map-marker marker-full" style="top: 97.02%; left: 73.64%;">
      <div class="marker-badge"><i class="fas fa-seedling"></i></div>
      <div class="marker-content">
        <span class="marker-title">Pumpkins</span>
        <span class="marker-desc"></span>
      </div>
    </div>

    <div class="map-marker marker-icon-only" style="top: 43.83%; left: 76.93%;">
      <div class="marker-badge"><i class="fas fa-football-ball"></i></div>
      <span class="marker-tooltip">Sports</span>
    </div>

    <div class="map-marker marker-full" style="top: 72.14%; left: 86.07%;">
      <div class="marker-badge"><i class="fas fa-football-ball"></i></div>
      <div class="marker-content">
        <span class="marker-title">Yard Games</span>
        <span class="marker-desc"></span>
      </div>
    </div>

    <div class="map-marker marker-icon-only" style="top: 79.32%; left: 96.21%;">
      <div class="marker-badge"><i class="fas fa-utensils"></i></div>
      <span class="marker-tooltip">Food</span>
    </div>

    <div class="map-marker marker-icon-only" style="top: 61.11%; left: 88.21%;">
      <div class="marker-badge"><i class="fas fa-restroom"></i></div>
      <span class="marker-tooltip">Restrooms</span>
    </div>

    <div class="map-marker marker-icon-only" style="top: 56.42%; left: 79.93%;">
      <div class="marker-badge"><i class="fas fa-music"></i></div>
      <span class="marker-tooltip">Live Music</span>
    </div>

    <div class="map-marker marker-icon-only" style="top: 68.39%; left: 79.93%;">
      <div class="marker-badge"><i class="fas fa-fire"></i></div>
      <span class="marker-tooltip">New Location</span>
    </div>

  </div>

  <script>
    // Tap support for mobile icon tooltips
    document.querySelectorAll('.marker-icon-only').forEach(marker => {
      marker.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.marker-icon-only').forEach(m => m.classList.remove('active'));
        marker.classList.add('active');
      });
    });
    document.addEventListener('click', () => {
      document.querySelectorAll('.marker-icon-only').forEach(m => m.classList.remove('active'));
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9th Annual Fall Kickoff Site Map</title>
    <style>
        :root {
            --terracotta: #a35d47;
            --cream: #f7f7f3;
            --dark-charcoal: #2d2d2d;
            --gold: #c9933b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            line-height: 1.4;
        }

        header {
            background-color: #1e1e1e;
            padding: 12px 20px;
            border-bottom: 2px solid var(--gold);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .header-titles h1 {
            color: var(--gold);
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header-titles p {
            color: #aaa;
            font-size: 0.85rem;
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-header {
            background-color: var(--terracotta);
            color: #fff;
            padding: 8px 14px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-header:hover {
            background-color: #8c4c37;
        }

        .btn-secondary {
            background-color: #333;
            border: 1px solid #555;
        }

        .btn-secondary:hover {
            background-color: #444;
        }

        #mapContainer {
            position: relative;
            max-width: 1200px;
            margin: 20px auto;
            border: 2px solid #333;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            background-color: #1a1a1a;
        }

        #siteMapImage {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Tooltip styling for pins */
        .map-pin {
            position: absolute;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 10;
        }

        .map-pin:hover {
            z-index: 30;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-titles">
            <h1>9TH ANNUAL FALL KICKOFF SITE MAP</h1>
            <p>6825 Sweetgrass Lane • Event Layout Plan</p>
        </div>
        <div class="header-actions">
            <a href="./index.html" class="btn-header btn-secondary">📜 Back to Invitation</a>
            <button class="btn-header" onclick="window.print()">🖨️ Print / Save PDF</button>
        </div>
    </header>

    <div id="mapContainer">
        <img id="siteMapImage" src="./yard-map.jpg" alt="Fall Kickoff Yard Map Layout" />
    </div>

    <script>
        // Automatic image loader verification
        window.addEventListener('load', () => {
            const img = document.getElementById('siteMapImage');
            if (img && !img.complete) {
                img.src = './yard-map.jpg?v=' + new Date().getTime();
            }
        });
    </script>
</body>
</html>

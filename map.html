<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>9th Annual Fall Kickoff Site Map</title>
    <style>
        :root {
            --terracotta: #a35d47;
            --cream: #f7f7f3;
            --dark: #121212;
            --gold: #c9933b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--dark);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* HEADER & NAVIGATION */
        header {
            width: 100%;
            background-color: #1e1e1e;
            padding: 12px 16px;
            border-bottom: 2px solid var(--gold);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .header-titles h1 {
            color: var(--gold);
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .header-titles p {
            color: #aaa;
            font-size: 0.75rem;
            margin-top: 2px;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-shrink: 0;
        }

        .btn-header {
            background-color: var(--terracotta);
            color: #ffffff;
            padding: 9px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.85rem;
            border: none;
            cursor: pointer;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .btn-header:hover {
            background-color: #8c4c37;
        }

        .btn-secondary {
            background-color: #333;
            border: 1px solid #555;
        }

        .btn-secondary:hover {
            background-color: #444;
        }

        .instruction-banner {
            width: 100%;
            text-align: center;
            background-color: #181818;
            color: var(--gold);
            padding: 8px 12px;
            font-size: 0.8rem;
            border-bottom: 1px solid #2a2a2a;
        }

        /* MAP DISPLAY CONTAINER */
        .map-wrapper {
            width: 100%;
            max-width: 1100px;
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .map-card {
            width: 100%;
            border: 2px solid var(--gold);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8);
            background-color: #000;
        }

        .map-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 6px;
        }

        /* MOBILE ADJUSTMENTS */
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                align-items: stretch;
                padding: 12px;
            }

            .header-titles {
                text-align: center;
                margin-bottom: 6px;
            }

            .header-actions {
                width: 100%;
                justify-content: space-between;
            }

            .btn-header {
                flex: 1;
                justify-content: center;
                text-align: center;
                padding: 10px 8px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-titles">
            <h1>9th Annual Fall Kickoff</h1>
            <p>6825 Sweetgrass Lane • Site Layout Plan</p>
        </div>
        <div class="header-actions">
            <a href="index.html" class="btn-header btn-secondary">📜 Back to Invitation</a>
            <button class="btn-header" onclick="window.print()">🖨️ Print / PDF</button>
        </div>
    </header>

    <div class="instruction-banner">
        🔍 Tip: Pinch or double-tap the map on mobile to zoom in on activity zones!
    </div>

    <div class="map-wrapper">
        <div class="map-card">
            <img src="yard-map.jpg" alt="Fall Kickoff Site Map" class="map-img">
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation - 9th Annual Fall Kickoff</title>
    <style>
        :root {
            --terracotta: #a35d47;
            --cream: #f7f7f3;
            --dark-charcoal: #2d2d2d;
            --gold: #c9933b;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Garamond', 'EB Garamond', serif;
            background-color: #e5e5e0;
            color: var(--dark-charcoal);
            line-height: 1.5;
            padding: 40px 0;
        }

        .invitation-card {
            background-color: var(--cream);
            width: 8.5in;
            min-height: 11in;
            padding: 0.6in 0.8in;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .invitation-card::before {
            content: "";
            position: absolute;
            top: 15px; left: 15px; right: 15px; bottom: 15px;
            border: 2px solid var(--terracotta);
            pointer-events: none;
        }

        .invitation-card::after {
            content: "";
            position: absolute;
            top: 21px; left: 21px; right: 21px; bottom: 21px;
            border: 1px solid var(--gold);
            pointer-events: none;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        .accent-top {
            color: var(--gold);
            font-size: 2rem;
            letter-spacing: 5px;
            margin-top: 10px;
            margin-bottom: 5px;
        }

        h1 {
            color: var(--terracotta);
            font-size: 3.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.1;
            margin-bottom: 10px;
        }

        .main-details {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--terracotta);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .address-display {
            font-size: 1.2rem;
            color: var(--dark-charcoal);
            font-style: italic;
            margin-bottom: 15px;
        }

        .intro-p {
            font-size: 1.15rem;
            text-align: center;
            max-width: 85%;
            margin: 0 auto 20px auto;
            line-height: 1.5;
            color: #444;
        }

        .section-title {
            color: var(--terracotta);
            font-size: 1.2rem;
            border-bottom: 1px solid var(--gold);
            padding-bottom: 3px;
            margin: 15px 0 12px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: bold;
        }

        .timeline-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .timeline-row {
            display: flex;
            align-items: baseline;
            text-align: left;
            font-size: 1.1rem;
            border-bottom: 1px dashed rgba(0,0,0,0.06);
            padding-bottom: 4px;
        }

        .timeline-time {
            font-weight: bold;
            color: var(--terracotta);
            width: 160px;
            flex-shrink: 0;
        }

        .timeline-desc {
            color: var(--dark-charcoal);
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            text-align: left;
            margin-bottom: 15px;
        }

        .info-box ul {
            list-style-type: square;
            padding-left: 18px;
            font-size: 1.05rem;
        }

        .info-box li {
            margin-bottom: 6px;
        }

        .banner-alert {
            background-color: #f0ede6;
            border-left: 4px solid #4a6b53;
            padding: 10px 14px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 0 4px 4px 0;
            margin-bottom: 15px;
            text-align: left;
        }

        .rsvp-form-container {
            background-color: var(--terracotta);
            color: var(--cream);
            padding: 20px;
            border-radius: 6px;
            text-align: left;
            margin-top: auto;
            z-index: 5;
        }

        .rsvp-form-container h3 {
            font-size: 1.4rem;
            color: #ffffff;
            text-transform: uppercase;
            margin-bottom: 12px;
            letter-spacing: 1px;
            text-align: center;
            border-bottom: 1px dashed rgba(255,255,255,0.3);
            padding-bottom: 5px;
        }
